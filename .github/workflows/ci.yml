name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coding-style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install formatting tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-20 shfmt black cppcheck
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Check format
        run: bash .ci/check-format.sh
      - name: Check trailing newlines
        run: bash .ci/check-newline.sh
      - name: Check configuration ABI guard
        run: bash .ci/check-abi-guard.sh
      # Library sources only. The tests trip style checks that say nothing
      # about the allocator.
      #
      # Two findings cannot be avoided and are suppressed here rather than with
      # analyser comments in the allocator. cppcheck cannot evaluate sizeof on
      # a struct it has only seen declared, so it folds BLOCK_SIZE_MIN to zero
      # and reports adjust_size() as comparing an unsigned value against zero.
      # And it has no model for weak linkage, so it treats the default
      # tlsf_resize() as the only definition and calls every success branch
      # that depends on an override unreachable. That is one limitation, not
      # the three findings it reports.
      #
      # The third is the preprocessor emulation giving up on the ABI guard.
      # Older simplecpp, including the one in the cppcheck Ubuntu 24.04 ships,
      # reports "Invalid ## usage" on the token pastes that build the
      # configuration-suffixed symbol names. Every real compiler in this matrix
      # expands them, and .ci/check-abi-guard.sh proves the result links, so
      # the finding says something about cppcheck rather than about the header.
      #
      # The suppressions are flags rather than a suppression file: the file
      # format is not portable across cppcheck versions, and the one in Ubuntu
      # 24.04 rejects the comments that made the file worth having.
      #
      # They are scoped to a file, not a line. Line-pinned suppressions move
      # under any edit above them and only this job notices. The cost is that
      # a genuine always-true condition in src/tlsf.c no longer fails the job;
      # every other id, and every other file, still does.
      - name: Static analysis
        run: |
          cppcheck --enable=warning,style,performance,portability --std=c11 \
            -I include --suppress=missingIncludeSystem \
            --suppress=unsignedLessThanZero:src/tlsf.c \
            --suppress=knownConditionTrueFalse:src/tlsf.c \
            --suppress=preprocessorErrorDirective:include/tlsf.h \
            --suppress=preprocessorErrorDirective:include/tlsf_thread.h \
            --error-exitcode=1 --quiet src include

  # Nothing measured how much of the allocator the suite reached until this
  # job existed, and the first run found eight unreached lines.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Line coverage floor
        run: bash .ci/check-coverage.sh

  # Coverage-guided fuzzing over the same target 'make check' replays. A short
  # budget per push: this is a smoke test that the harness still builds and
  # that the last change did not open an obvious hole, not a fuzzing campaign.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # -fsanitize=fuzzer needs the compiler-rt fuzzer library, which is a
      # recommended package of clang rather than part of the base image.
      - name: Install clang with the fuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
        env:
          DEBIAN_FRONTEND: noninteractive
      # 200000 executions took over seven minutes of the ten this job allows,
      # which is a timeout waiting to happen on a slower runner. A smoke test
      # does not need the extra runs; a real campaign is a local 'make fuzz'.
      - name: Fuzz the allocator
        run: make fuzz FUZZ_CC=clang FUZZ_RUNS=50000

  build-and-test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cc: gcc
            cflags: ""
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-fsanitize=undefined"
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-fsanitize=address,undefined"
          - runner: ubuntu-24.04
            cc: clang
            cflags: ""
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=undefined"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=address,undefined"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=address,undefined -DTLSF_ENABLE_POISON"
          - runner: ubuntu-24.04-arm
            cc: gcc
            cflags: ""
          - runner: ubuntu-24.04-arm
            cc: clang
            cflags: ""
          - runner: ubuntu-24.04-arm
            cc: gcc
            cflags: "-fsanitize=address,undefined"
          # ThreadSanitizer: the only sanitizer that sees races in the
          # per-arena locking of src/tlsf_thread.c. ASan does not.
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=thread"
          - runner: ubuntu-24.04-arm
            cc: gcc
            cflags: "-fsanitize=thread"
          # Compile-time configuration knobs. Without these the reduced-pool
          # and split-threshold paths rot untested.
          - runner: ubuntu-24.04
            cc: gcc
            # These two entries are what exercise tests/test.c's pool ceiling
            # test; it self-skips in unconstrained builds where the ceiling
            # exceeds allocatable memory.
            cflags: "-DTLSF_MAX_POOL_BITS=20"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-DTLSF_MAX_POOL_BITS=24 -fsanitize=address,undefined"
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-DTLSF_SPLIT_THRESHOLD=64"
          # C11 threads reaching both languages at once. 'make check' links
          # tests/test_cpp.cpp against the same src/tlsf_thread.c object, so the
          # C and the C++ unit have to select the same lock backend from the
          # same flag. Before the C++ arm of that selection existed this entry
          # failed to link, which is issue #40 spelled in glibc rather than
          # MSVC. glibc has had '<threads.h>' since 2.28.
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-DTLSF_C11_THREADS"
          # Release configuration. NDEBUG covers libc assert(); clearing
          # TLSF_DEBUG_FLAGS covers the library's own knobs, which are on for
          # every other entry, so this is the only job that compiles the empty
          # ASSERT(), the MAYBE_UNUSED machinery it needs, and the tlsf_check()
          # stub. That is the build users ship. The test binaries undefine
          # NDEBUG themselves, so they keep reporting pass/fail either way.
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-DNDEBUG"
            make_args: "TLSF_DEBUG_FLAGS="
          # Portable bit-scan fallbacks used by toolchains without
          # __builtin_ctz / _BitScanForward. Unreachable on these runners
          # unless forced.
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-DTLSF_NO_INTRINSICS"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-DTLSF_NO_INTRINSICS -fsanitize=address,undefined"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make all ${{ matrix.make_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
          CPPFLAGS: ${{ matrix.cflags }}
      - name: Test
        run: make check ${{ matrix.make_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}
          CPPFLAGS: ${{ matrix.cflags }}
  
  # 32-bit build: exercises the _TLSF_SIZE_WIDTH == 32 paths (ALIGN_SHIFT 2,
  # _TLSF_FL_MAX 31, __builtin_clzl) that the 64-bit matrix never compiles.
  build-32bit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install multilib toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Build
        run: make all
        env:
          CPPFLAGS: "-m32"
      - name: Test
        run: make check
        env:
          CPPFLAGS: "-m32"

  # Deductive verification of the annotated leaf helpers. Runs in the official
  # Frama-C image so the job does not pay for an opam build on every push.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: framac/frama-c:32.1
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: Frama-C WP
        run: |
          chown -R opam:opam "$GITHUB_WORKSPACE"
          su -s /bin/sh opam -c 'opam exec -- make verify'

  build-windows-msvc:
    runs-on: windows-latest
    # A healthy run finishes in well under a minute. The old ten minute limit
    # only ever applied to a hang, where it spent nine of them confirming what
    # the first one had already shown.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      # tlsf.c does not include tlsf_thread.h, so none of the flags below
      # change how it compiles, and every executable can link the same object.
      # Compiling it once instead of once per executable is most of this job's
      # build time.
      - name: Compile TLSF Core with MSVC
        run: |
          cl.exe /c /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK src\tlsf.c /Fo:tlsf.obj
      - name: Compile Single-Threaded TLSF with MSVC
        run: |
          cl.exe /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK tests\test.c tlsf.obj /Fe:test_tlsf.exe
      - name: Run Single-Threaded Tests
        run: |
          .\test_tlsf.exe
      - name: Compile Multi-Threaded TLSF with MSVC (C11)
        run: |
          cl.exe /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK /DTLSF_C11_THREADS src\tlsf_thread.c tests\test_thread.c tlsf.obj /Fe:test_thread.exe
      - name: Run Multi-Threaded Tests
        run: |
          .\test_thread.exe
      # Neither step below passes /DTLSF_C11_THREADS, and that is the test: the
      # C unit and the C++ unit have to agree on the lock backend and on the
      # token paste, or the link fails on an unresolved 'tlsf_thread_*' symbol.
      # Reverting either half of the fix fails here. This pair is also the only
      # place MSVC's two preprocessors meet, since /std:c11 implies
      # /Zc:preprocessor and /std:c++14 does not.
      #
      # The wrapper compiles in its own step because a step reports the exit
      # status of its last command only, which would hide a failed compile and
      # link the stale object left by the C11 step above.
      - name: Compile Thread Wrapper for the C++ Link
        run: |
          cl.exe /c /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK src\tlsf_thread.c /Fo:tlsf_thread.obj
      - name: Compile C++ TLSF Test with MSVC
        run: |
          cl.exe /Iinclude /O2 /W3 /we4146 /we4334 /std:c++14 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK tests\test_cpp.cpp tlsf.obj tlsf_thread.obj /Fe:test_cpp.exe
      - name: Run C++ TLSF Test
        run: |
          .\test_cpp.exe
      # The same pair with the flag on both units, which is what the reporter
      # of issue #40 was after. MSVC ships '<threads.h>' from 17.8 on, so the
      # C++ unit finds it through __has_include and has to land on the same
      # 'mtx_t' layout the C unit picked. This is also the only check that MSVC
      # can preprocess and compile that header outside C mode at all; if it
      # cannot, the C++ arm of the selection has to go back to declining.
      #
      # /std:c++14 is MSVC's default and the mode a user reaches without asking,
      # so it is the one worth testing. It reaches 'mtx_t' through the C++ arm's
      # __has_include probe; the version fallback beside that probe is not
      # exercised here and is not expected to be, see the header.
      - name: Compile Thread Wrapper for the C++ C11 Link
        run: |
          cl.exe /c /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK /DTLSF_C11_THREADS src\tlsf_thread.c /Fo:tlsf_thread_c11.obj
      - name: Compile C++ TLSF Test with MSVC (C11)
        run: |
          cl.exe /Iinclude /O2 /W3 /we4146 /we4334 /std:c++14 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK /DTLSF_C11_THREADS tests\test_cpp.cpp tlsf.obj tlsf_thread_c11.obj /Fe:test_cpp_c11.exe
      - name: Run C++ TLSF Test (C11)
        run: |
          .\test_cpp_c11.exe
      # The stress test on the lock a Windows user now gets without asking.
      # Until the selection above changed, every MSVC build reached 'mtx_t'
      # whether or not it asked for it, so 'SRWLOCK' was unreachable and went
      # unrun; it is the default from here on. The C++ steps compile it but call
      # the wrapper once each on one thread, so nothing else in this job would
      # notice a wrong polarity in TLSF_LOCK_TRY or an acquire paired with the
      # wrong release. Last of the wrapper steps because it recompiles
      # 'tlsf_thread.obj' in the working directory as a side effect.
      - name: Compile Multi-Threaded TLSF with MSVC (native lock)
        run: |
          cl.exe /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK src\tlsf_thread.c tests\test_thread.c tlsf.obj /Fe:test_thread_native.exe
      - name: Run Multi-Threaded Tests (native lock)
        run: |
          .\test_thread_native.exe
      - name: Compile Benchmark TLSF with MSVC
        run: |
          cl.exe /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK tests\bench.c tlsf.obj /Fe:bench_tlsf.exe /link Psapi.lib
      - name: Run Benchmark TLSF
        run: |
          .\bench_tlsf.exe -l 10000 -i 3 -w 1
      - name: Compile WCET TLSF with MSVC
        run: |
          cl.exe /Iinclude /O2 /W3 /we4146 /we4334 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK tests\wcet.c tlsf.obj /Fe:wcet_tlsf.exe
      - name: Run WCET TLSF
        run: |
          .\wcet_tlsf.exe -i 100 -w 10

  wcet:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-matplotlib
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Build (release, no assert/check overhead)
        run: make all TLSF_DEBUG_FLAGS=
      - name: WCET measurement
        run: ./build/wcet -i 5000 -w 500 -r build/wcet_raw.csv | tee build/wcet_output.txt
      - name: Generate plots
        run: python3 scripts/wcet_plot.py build/wcet_raw.csv -o build/wcet
      - name: Job summary
        if: always()
        run: |
          {
            echo "## WCET Results (${{ matrix.arch }})"
            echo ""
            echo '```'
            cat build/wcet_output.txt 2>/dev/null || echo "WCET measurement failed or was skipped."
            echo '```'
            echo ""
            echo "Box plot and histogram available in the **wcet-${{ matrix.arch }}** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WCET artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wcet-${{ matrix.arch }}
          path: |
            build/wcet_output.txt
            build/wcet_raw.csv
            build/wcet_boxplot.png
            build/wcet_histogram.png

  wcet-pr-summary:
    needs: wcet
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download WCET artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: wcet-*
          path: artifacts
          merge-multiple: false
      - name: Update consolidated PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- wcet-summary -->"
          {
            echo "$MARKER"
            echo "## WCET Results"
            for arch in x86-64 arm64; do
              output="artifacts/wcet-$arch/wcet_output.txt"
              echo ""
              echo "### $arch"
              echo '```'
              cat "$output" 2>/dev/null || echo "WCET measurement failed or was skipped."
              echo '```'
            done
          } > /tmp/comment.md

          for marker in '<!-- wcet-x86-64 -->' '<!-- wcet-arm64 -->'; do
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" |
              xargs -r -n1 -I{} gh api "repos/${{ github.repository }}/issues/comments/{}" -X DELETE
          done

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -X PATCH -F body=@/tmp/comment.md
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -X POST -F body=@/tmp/comment.md
          fi
