name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coding-style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install formatting tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-20 shfmt black
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Check format
        run: bash .ci/check-format.sh
      - name: Check trailing newlines
        run: bash .ci/check-newline.sh

  build-and-test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cc: gcc
            cflags: ""
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-fsanitize=undefined"
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-fsanitize=address,undefined"
          - runner: ubuntu-24.04
            cc: clang
            cflags: ""
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=undefined"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=address,undefined"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=address,undefined -DTLSF_ENABLE_POISON"
          - runner: ubuntu-24.04-arm
            cc: gcc
            cflags: ""
          - runner: ubuntu-24.04-arm
            cc: clang
            cflags: ""
          - runner: ubuntu-24.04-arm
            cc: gcc
            cflags: "-fsanitize=address,undefined"
          # ThreadSanitizer: the only sanitizer that sees races in the
          # per-arena locking of src/tlsf_thread.c. ASan does not.
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-fsanitize=thread"
          - runner: ubuntu-24.04-arm
            cc: gcc
            cflags: "-fsanitize=thread"
          # Compile-time configuration knobs. Without these the reduced-pool
          # and split-threshold paths rot untested.
          - runner: ubuntu-24.04
            cc: gcc
            # These two entries are what exercise tests/test.c's pool ceiling
            # test; it self-skips in unconstrained builds where the ceiling
            # exceeds allocatable memory.
            cflags: "-DTLSF_MAX_POOL_BITS=20"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-DTLSF_MAX_POOL_BITS=24 -fsanitize=address,undefined"
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-DTLSF_SPLIT_THRESHOLD=64"
          # Portable bit-scan fallbacks used by toolchains without
          # __builtin_ctz / _BitScanForward. Unreachable on these runners
          # unless forced.
          - runner: ubuntu-24.04
            cc: gcc
            cflags: "-DTLSF_NO_INTRINSICS"
          - runner: ubuntu-24.04
            cc: clang
            cflags: "-DTLSF_NO_INTRINSICS -fsanitize=address,undefined"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make all
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}
      - name: Test
        run: make check
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}
  
  # 32-bit build: exercises the _TLSF_SIZE_WIDTH == 32 paths (ALIGN_SHIFT 2,
  # _TLSF_FL_MAX 31, __builtin_clzl) that the 64-bit matrix never compiles.
  build-32bit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install multilib toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Build
        run: make all
        env:
          CFLAGS: "-m32"
      - name: Test
        run: make check
        env:
          CFLAGS: "-m32"

  # Deductive verification of the annotated leaf helpers. Runs in the official
  # Frama-C image so the job does not pay for an opam build on every push.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: framac/frama-c:32.1
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: Frama-C WP
        run: |
          chown -R opam:opam "$GITHUB_WORKSPACE"
          su -s /bin/sh opam -c 'opam exec -- make verify'

  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile Single-Threaded TLSF with MSVC
        run: |
          cl.exe /Iinclude /O2 /W3 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK src\tlsf.c tests\test.c /Fe:test_tlsf.exe
      - name: Run Single-Threaded Tests
        run: |
          .\test_tlsf.exe
      - name: Compile Multi-Threaded TLSF with MSVC (C11)
        run: |
          cl.exe /Iinclude /O2 /W3 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK /DTLSF_C11_THREADS src\tlsf.c src\tlsf_thread.c tests\test_thread.c /Fe:test_thread.exe
      - name: Run Multi-Threaded Tests
        run: |
          .\test_thread.exe
      - name: Compile Benchmark TLSF with MSVC
        run: |
          cl.exe /Iinclude /O2 /W3 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK src\tlsf.c tests\bench.c /Fe:bench_tlsf.exe /link Psapi.lib
      - name: Run Benchmark TLSF
        run: |
          .\bench_tlsf.exe -l 10000 -i 3 -w 1
      - name: Compile WCET TLSF with MSVC
        run: |
          cl.exe /Iinclude /O2 /W3 /std:c11 /DTLSF_ENABLE_ASSERT /DTLSF_ENABLE_CHECK src\tlsf.c tests\wcet.c /Fe:wcet_tlsf.exe
      - name: Run WCET TLSF
        run: |
          .\wcet_tlsf.exe -i 100 -w 10

  wcet:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-matplotlib
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Build (release, no assert/check overhead)
        run: make all CFLAGS="-Iinclude -std=gnu11 -O2 -Wall -Wextra -Wconversion"
      - name: WCET measurement
        run: ./build/wcet -i 5000 -w 500 -r build/wcet_raw.csv | tee build/wcet_output.txt
      - name: Generate plots
        run: python3 scripts/wcet_plot.py build/wcet_raw.csv -o build/wcet
      - name: Job summary
        if: always()
        run: |
          {
            echo "## WCET Results (${{ matrix.arch }})"
            echo ""
            echo '```'
            cat build/wcet_output.txt 2>/dev/null || echo "WCET measurement failed or was skipped."
            echo '```'
            echo ""
            echo "Box plot and histogram available in the **wcet-${{ matrix.arch }}** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload WCET artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wcet-${{ matrix.arch }}
          path: |
            build/wcet_output.txt
            build/wcet_raw.csv
            build/wcet_boxplot.png
            build/wcet_histogram.png

  wcet-pr-summary:
    needs: wcet
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download WCET artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: wcet-*
          path: artifacts
          merge-multiple: false
      - name: Update consolidated PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- wcet-summary -->"
          {
            echo "$MARKER"
            echo "## WCET Results"
            for arch in x86-64 arm64; do
              output="artifacts/wcet-$arch/wcet_output.txt"
              echo ""
              echo "### $arch"
              echo '```'
              cat "$output" 2>/dev/null || echo "WCET measurement failed or was skipped."
              echo '```'
            done
          } > /tmp/comment.md

          for marker in '<!-- wcet-x86-64 -->' '<!-- wcet-arm64 -->'; do
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" |
              xargs -r -n1 -I{} gh api "repos/${{ github.repository }}/issues/comments/{}" -X DELETE
          done

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -X PATCH -F body=@/tmp/comment.md
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -X POST -F body=@/tmp/comment.md
          fi
